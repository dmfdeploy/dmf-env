name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck bin/
        run: |
          set -eu
          shopt -s nullglob
          scripts=(bin/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "SKIP: no scripts found in bin/"
            exit 0
          fi
          # -S error: gate on real errors only (the tree has pre-existing info/warning/style nits)
          shellcheck -S error "${scripts[@]}"

  tofu-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install OpenTofu
        env:
          TOFU_VERSION: "1.9.0"
          TOFU_SHA256: "638dd3fb9ecfa6fd9f54a0024b195b12b407c51ccee6f83b18a75a8be79f8214"
        run: |
          set -eu
          curl -fsSLo /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  /tmp/tofu.zip" | sha256sum -c -
          unzip -o /tmp/tofu.zip -d /tmp
          sudo mv /tmp/tofu /usr/local/bin/tofu
          tofu --version
      - name: tofu fmt check
        run: |
          tofu fmt -check -recursive terraform/hetzner
          tofu fmt -check -recursive terraform/modules/hetzner/cluster
      - name: tofu validate — terraform/hetzner
        working-directory: terraform/hetzner
        run: |
          tofu init -backend=false
          tofu validate
      - name: tofu validate — terraform/modules/hetzner/cluster
        working-directory: terraform/modules/hetzner/cluster
        run: |
          tofu init -backend=false
          tofu validate

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install test dependencies
        env:
          SOPS_VERSION: "3.13.1"
          SOPS_SHA256: "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a"
        run: |
          set -eu
          # age is in apt; sops is NOT in ubuntu-24.04 default repos → pinned release.
          sudo apt-get update && sudo apt-get install -y age jq
          curl -fsSLo /tmp/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version
      - name: wizard-noninteractive-parity
        run: |
          bash tests/wizard-noninteractive-parity.sh
      - name: bundle-set-roundtrip
        run: |
          bash tests/bundle-set-roundtrip.sh

  working-model:
    # Working-model block sync (umbrella issue dmfdeploy/dmfdeploy#32): the
    # agent-context block in CLAUDE.md/AGENTS.md/QWEN.md must stay byte-identical
    # to the umbrella template; --strict fails on a missing or drifted block.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 — umbrella: canonical template + checker
        with:
          repository: dmfdeploy/dmfdeploy
          path: .umbrella
          persist-credentials: false
      - name: Working-model block sync (strict)
        run: .umbrella/bin/check-working-model-sync.sh --repo . --strict --template .umbrella/docs/templates/working-model-block.md
