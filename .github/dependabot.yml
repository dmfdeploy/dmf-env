---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "no-issue"
    commit-message:
      prefix: "ci(deps)"
    # Major upgrades are done on purpose, as their own changes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
